# General settings
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g base-index 1
set -g status-position top
set -g pane-base-index 1
set -g prefix C-b
bind C-b send-prefix
set-option -g focus-events on
set -g extended-keys on
set -g mouse on
set -g history-limit 50000

set -g @vim_navigator_mapping_left "C-Left C-h"
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy/scroll keybinds
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -n PageUp copy-mode -u

# Open new panes and windows in the current pane's directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Utility keybinds
bind F1 set-option -g status
bind r source-file ~/.config/tmux/tmux.conf

# Session picker popup (zoxide + fzf)
bind f display-popup -E -w 60% -h 60% "~/.config/tmux/scripts/sessionizer.sh"

# Lazygit popup in the current pane's directory
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# AI macros: prefix + a opens the "ai" key table, then a second key picks the action
bind a switch-client -T ai
# prefix + a + i: Claude Code in a side-by-side pane in the current pane's directory
bind -T ai i split-window -h -c "#{pane_current_path}" "claude"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session persistence: save/restore with prefix + C-s / C-r,
# auto-save every 15 min and auto-restore on start
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Install tpm and plugins on first start
if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'

# Tokyonight night palette
set -g status-style "bg=default,fg=#a9b1d6"
set -g message-style "bg=#292e42,fg=#7aa2f7"
set -g message-command-style "bg=#292e42,fg=#7aa2f7"
set -g mode-style "bg=#283457,fg=#c0caf5"
set -g popup-border-style "fg=#7aa2f7"
set -g clock-mode-colour "#7aa2f7"
set -g display-panes-colour "#3b4261"
set -g display-panes-active-colour "#7aa2f7"

# Status right: time only
set -g status-right "#[bg=default,fg=default] %H:%M "

# Window tabs: flat color blocks, inactive grey, active blue
setw -g window-status-separator " "
setw -g window-status-format "#[bg=#292e42,fg=#a9b1d6] #I #W #[bg=default,fg=default]"
setw -g window-status-current-format "#[bg=#7aa2f7,fg=#16161e,bold] #I #W#{?window_zoomed_flag,*Z,} #[bg=default,fg=default]"

# Prefix indicator: red PRFX badge and red active pane border while prefix is active
set -g status-left "#{?client_prefix,#[bg=#f7768e]#[fg=#16161e]#[bold] PRFX #[default],}"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "#{?client_prefix,fg=#f7768e,fg=#7aa2f7}"
