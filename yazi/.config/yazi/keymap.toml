[mgr]
prepend_keymap = [
  { on = ["M","s"], run = "plugin sshfs menu",               desc = "Open SSHFS options" },
  { on = "!", for = "unix", run = 'shell "$SHELL" --block',  desc = "Open $SHELL here" },
  { on = "T", run = "plugin toggle-pane max-preview",       desc = "Maximize or restore the preview pane" },

  # Navigation
  { on = "l", run = "plugin smart-enter",                   desc = "Enter the child directory, or open the file" },
  { on = "f", run = "plugin jump-to-char",                  desc = "Jump to char" },
  { on = "F", run = "plugin smart-filter",                  desc = "Smart filter" },

  # Tools
  { on = ["g","i"], run = "plugin lazygit",                 desc = "Open lazygit" },
  { on = "<A-d>",   run = "plugin diff",                    desc = "Diff the selected with the hovered file" },
  { on = "<A-D>",   run = 'shell --block -- diff -Naur "$1" "$0" | bat -l diff --paging=always', desc = "View diff of selected vs hovered" },
  { on = ["c","m"], run = "plugin chmod",                   desc = "Chmod on selected files" },
  { on = ["c","a","a"], run = "plugin compress",            desc = "Archive selected files" },
  { on = ["c","a","p"], run = "plugin compress -p",         desc = "Archive selected files (password)" },
  { on = ["c","a","l"], run = "plugin compress -l",         desc = "Archive selected files (compression level)" },
]
