[updates]
# Refresh the offline pages cache in the background once a week
auto_update = true
auto_update_interval_hours = 168

# Catppuccin Mocha colors
[style.description]
foreground = { rgb = { r = 205, g = 214, b = 244 } }

[style.command_name]
foreground = { rgb = { r = 137, g = 180, b = 250 } }
bold = true

[style.example_text]
foreground = { rgb = { r = 166, g = 227, b = 161 } }

[style.example_code]
foreground = { rgb = { r = 137, g = 220, b = 235 } }

[style.example_variable]
foreground = { rgb = { r = 249, g = 226, b = 175 } }
italic = true
