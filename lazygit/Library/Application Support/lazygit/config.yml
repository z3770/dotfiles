gui:
  nerdFontsVersion: "3"
  # Scroll the diff panel 1 line per wheel event (default 2) for smoother scrolling
  scrollHeight: 1
  theme:
    activeBorderColor:
      - "#ff9e64"
      - "bold"
    inactiveBorderColor:
      - "#27a1b9"
    searchingActiveBorderColor:
      - "#ff9e64"
      - "bold"
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#283457"
    cherryPickedCommitFgColor:
      - "#7aa2f7"
    cherryPickedCommitBgColor:
      - "#bb9af7"
    markedBaseCommitFgColor:
      - "#7aa2f7"
    markedBaseCommitBgColor:
      - "#e0af68"
    unstagedChangesColor:
      - "#db4b4b"
    defaultFgColor:
      - "#c0caf5"

git:
  # Render diffs with delta (styled by ~/.config/git/config); side-by-side is
  # too wide for the diff panel, so --features= drops it here
  diffRenderers:
    - type: stdinFilter
      command: delta --paging=never --features=
