gui:
  nerdFontsVersion: "3"
  # Scroll the diff panel 1 line per wheel event (default 2) for smoother scrolling
  scrollHeight: 1
  theme:
    activeBorderColor:
      - "#fab387"
      - "bold"
    inactiveBorderColor:
      - "#74c7ec"
    searchingActiveBorderColor:
      - "#fab387"
      - "bold"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#89b4fa"
    cherryPickedCommitBgColor:
      - "#cba6f7"
    markedBaseCommitFgColor:
      - "#89b4fa"
    markedBaseCommitBgColor:
      - "#f9e2af"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"

git:
  # Render diffs with delta (styled by ~/.config/git/config); side-by-side is
  # too wide for the diff panel, so --features= drops it here
  diffRenderers:
    - type: stdinFilter
      command: delta --paging=never --features=
